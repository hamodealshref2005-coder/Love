<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الصداقة الأصلي 🤞❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #2d3436;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: linear-gradient(315deg, #a29bfe 0%, #6c5ce7 74%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--dark);
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: var(--primary); font-weight: 900; font-size: 28px; margin-bottom: 10px; }
        p.subtitle { color: #636e72; font-size: 15px; margin-bottom: 25px; }

        input[type="text"] {
            width: 100%; padding: 15px; border: 2px solid #dfe6e9; border-radius: 12px;
            font-size: 16px; margin-bottom: 20px; text-align: center; font-weight: bold; transition: 0.3s;
        }
        input[type="text"]:focus { border-color: var(--primary); outline: none; }

        button {
            background: var(--primary); color: white; border: none; padding: 15px 30px;
            border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer;
            width: 100%; transition: 0.3s; box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3); margin-bottom: 10px;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4); }

        .hidden { display: none !important; }

        .question-block { text-align: right; margin-bottom: 25px; background: #f8f9fa; padding: 20px; border-radius: 15px; border-right: 5px solid var(--primary); }
        .question-title { font-weight: bold; font-size: 18px; margin-bottom: 15px; color: var(--dark); }
        
        select {
            width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #dfe6e9; font-size: 15px; font-weight: bold; background: white; cursor: pointer; outline: none;
        }
        select:focus { border-color: var(--primary); }

        .share-link {
            background: #e8f4fd; padding: 15px; border-radius: 10px; word-break: break-all;
            color: #0984e3; font-weight: bold; border: 2px dashed #74b9ff; margin: 20px 0; font-size: 14px;
        }

        .result-circle {
            width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(var(--primary) 0%, #eee 0%);
            display: flex; justify-content: center; align-items: center; margin: 20px auto; font-size: 30px; font-weight: 900; position: relative;
        }
        .result-circle::after { content: ""; position: absolute; width: 120px; height: 120px; background: white; border-radius: 50%; }
        .result-value { position: relative; z-index: 1; color: var(--dark); }
        
        .analysis-text { background: #f1f2f6; padding: 20px; border-radius: 15px; line-height: 1.6; font-size: 16px; margin-top: 20px; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="step-intro">
        <h1>اعرف مين بيحبك بجد! 🕵️‍♂️</h1>
        <p class="subtitle">اعمل اختبارك الخاص (20 سؤال) وابعت الرابط لأصحابك شوف مين حافظ تفاصيلك.</p>
        <input type="text" id="owner-name" placeholder="اكتب اسمك هنا...">
        <button onclick="goToSetup()">إنشاء اختباري الخاص 🚀</button>
    </div>

    <div id="step-setup" class="hidden">
        <h1>جهز اختبارك 🎯</h1>
        <p class="subtitle" id="setup-subtitle"></p>
        <div id="setup-questions-container"></div>
        <button onclick="generateLink()">حفظ وإنشاء الرابط 🔗</button>
    </div>

    <div id="step-link" class="hidden">
        <h1>الاختبار جاهز! 🎉</h1>
        <p class="subtitle">انسخ الرابط ده وابعتوا لأصحابك، والنتيجة هتوصلك على التليجرام.</p>
        <div class="share-link" id="final-link"></div>
        <button onclick="copyLink()">نسخ الرابط 📋</button>
        <button onclick="location.href=location.pathname" style="background: var(--dark);">عمل اختبار جديد 🔄</button>
    </div>

    <div id="step-friend-intro" class="hidden">
        <h1 id="friend-welcome"></h1>
        <p class="subtitle">نشوف إنت حافظه ولا بتدعي الصداقة؟ 👀 (20 سؤال)</p>
        <input type="text" id="friend-name" placeholder="اكتب اسمك إنت الأول...">
        <button onclick="startFriendQuiz()">يلا نبدأ 🔥</button>
    </div>

    <div id="step-friend-quiz" class="hidden">
        <h1 id="quiz-header">اختبار الصداقة</h1>
        <div id="friend-questions-container"></div>
        <button onclick="submitQuiz()">عرض النتيجة والتحليل 📊</button>
    </div>

    <div id="step-result" class="hidden">
        <h1>نسبة معرفتك بيه 💯</h1>
        <div class="result-circle" id="result-circle">
            <span class="result-value" id="result-percent">0%</span>
        </div>
        <h2 id="result-title" style="color: var(--primary);"></h2>
        <div class="analysis-text" id="analysis-text"></div>
        <button onclick="location.href=location.pathname" style="margin-top: 20px;">اعمل اختبارك إنت كمان 😉</button>
    </div>

</div>

<script>
    // بيانات بوت التليجرام
    const BOT_TOKEN = '8663967147:AAHJOfwDwYvDv9O3vt3eHxo8qavf9-RVx1Q';
    const CHAT_ID = '8213146484';

    // بنك الأسئلة الشامل (20 سؤال بعد التعديل)
    const quizData = [
        { q: "١. أنا مواليد شهر إيه؟", options: ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"] },
        { q: "٢. إيه الفصل اللي بعتبره التوب وبحس فيه إني عايش؟", options: ["الصيف والتلزيق والسهر", "الشتاء والمطر والهدوء", "الربيع وتفتيح الورد", "الخريف والهواء الساقع"] },
        { q: "٣. إيه الأكلة اللي مش بحبها وممكن أرفض أكلها خالص؟", options: ["سمك", "مكرونة", "إندومي", "محشي", "كشري", "بيتزا"] },
        { q: "٤. إيه أكتر صفة لو شفتها في حد بتقفلني منه وممكن أعمله بلوك؟", options: ["الكذب والتحوير", "البخل والأنانية", "التلزيق والمحن الأوفر", "الغرور والتكبر على الناس"] },
        { q: "٥. لما بتعصب أو بتخنق بجد، بيبقى رد فعلي إيه؟", options: ["بنعزل وبقفل تليفوني ومبكلمش حد", "بعيط وأنهار وأطلع الكبت", "باكل كتير جداً أو بنام", "بتعصب وأتخانق مع دبان وشي"] },
        { q: "٦. لو حطيت الهاند فري، غالباً المود بتاعي بيميل لأغاني إيه؟", options: ["رومانسي وحزين (هعيط)", "مهرجانات وراب (هخربها)", "أجنبي وبوب", "قديم وكلاسيك (أم كلثوم وعبدالحليم)"] },
        { q: "٧. لو سهران قدام فيلم أو مسلسل، هختار نوع إيه؟", options: ["كوميدي ومسرحيات (عايز أضحك)", "رعب وغموض", "دراما ورومانسي", "أكشن وضرب وخيال علمي"] },
        { q: "٨. إيه الصفة (التوكسيك) اللي فيا وبعترف بيها؟", options: ["العند والدماغ الناشفة", "الغيرة الأوفر والتملك", "المزاجية (ممكن أتقلب في ثانية)", "البرود والتطنيش فجأة"] },
        { q: "٩. إيه الكلمة أو اللزمة اللي دايماً بتلاقيني بقولها؟", options: ["يعم فكك / كبر دماغك", "بجد والله؟ / بتهزر!", "لول / عبث / هيييييح / كخ", "حرفياً / فاهم قصدي"] },
        { q: "١٠. لو معايا فلوس زيادة، غالباً بضيعها على إيه؟", options: ["الأكل والخروجات والدليفري", "اللبس والميكب/الشياكة", "الإلكترونيات والجيمنج", "بحوشهم ومبصرفهمش بسهولة"] },
        { q: "١١. إيه أكتر حاجة بتخليني أحس إن اللي قدامي بيحبني بجد؟", options: ["الكلام الحلو والاهتمام بتفاصيلي", "المفاجآت والهدايا", "يقف جنبي في المواقف الصعبة", "يهزر معايا ونضحك من قلبنا"] },
        { q: "١٢. لو هخرج، إيه نوع الخروجة اللي تظبط مزاجي؟", options: ["قعدة رايقة على البحر أو نيل", "دوشة كافيهات وزحمة ولمة", "أروح سينما أو مول أعمل شوبينج", "أفضل في البيت تحت البطانية أصلاً"] },
        { q: "١٣. أول حاجة بعملها لما أفتح عيني من النوم؟", options: ["بمسك الموبايل أفتح واتس وتيك توك", "بقوم أعمل قهوة أو شاي فوراً", "بقوم مخضوض عشان متأخر على حاجة", "بفضل باصص للسقف نص ساعة أستوعب"] },
        { q: "١٤. علاقتي بالنوم والسهر عاملة إزاي؟", options: ["كائن ليلي بسهر للفجر دايماً", "بنام بدري وبصحى بدري (روتين)", "نومي ملخبط وعشوائي جداً", "عندي قدرة أنام في أي وقت وأي مكان"] },
        { q: "١٥. وسط شلتي أو أصحابي، أنا بعتبر مين؟", options: ["العاقل اللي بيحل المشاكل وبيسمعهم", "المهرج اللي بيضحكهم وبيعمل مصايب", "المكتئب اللي دايماً بيشكي همه", "الشبح اللي بيختفي ويظهر فجأة"] },
        { q: "١٦. إيه أكتر حاجة بترعبني أو بعملها ألف حساب؟", options: ["الفقد وإن حد بحبه يبعد عني", "الفشل وإن شكلي يبقى وحش", "الحشرات والزواحف والأماكن العالية", "الخيانة أو إن حد يغدر بيا"] },
        { q: "١٧. لو جاتلي فرصة أسافر بكرا، هختار جو عامل إزاي؟", options: ["طبيعة وجبال وبلد أوروبية ساقعة", "بحر وجزر (زي المالديف أو بالي)", "بلد عربية فيها شغل وفلوس", "مدن زحمة وأضواء (زي نيويورك)"] },
        { q: "١٨. لما بكتئب، إيه الروتين الغريب اللي ممكن أعمله؟", options: ["أشغل أغاني وأقعد أعيط في الضلمة", "أهتم بشكلي أوي فجأة (ميك أب/لبس/حلاقة)", "أنزل أمشي في الشارع لوحدي من غير هدف", "أفتعل مشكلة مع أي حد في البيت"] },
        { q: "١٩. لو حد أذاني أو زعلني جامد، بتعامل إزاي؟", options: ["بمسك فيه وأرد اعتباري في وقتها", "بسامحه لو اعتذر بس مبنساش", "بعمله بلوك وبمسحه من حياتي كأنه لم يكن", "بستنى الفرصة وأردله الضربة أضعاف"] },
        { q: "٢٠. إيه أكتر حاجة بتمناها أو بتسعدني في الحياة عموماً؟", options: ["راحة البال والهدوء المادي", "ألاقي الشخص اللي يفهمني صح", "أنجح في شغلي وأحقق ذاتي", "أعيش حر من غير قيود ومسؤوليات"] }
    ];

    let ownerAnswers = [];
    let ownerName = "";

    function goToSetup() {
        ownerName = document.getElementById('owner-name').value.trim();
        if(!ownerName) return alert("يا عم اكتب اسمك الأول!");

        document.getElementById('step-intro').classList.add('hidden');
        document.getElementById('step-setup').classList.remove('hidden');
        document.getElementById('setup-subtitle').innerText = `يا ${ownerName}، اختار الإجابات اللي بتعبر عنك بجد عشان نختبر صحابك.`;

        const container = document.getElementById('setup-questions-container');
        quizData.forEach((item, index) => {
            let optionsHTML = item.options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
            container.innerHTML += `
                <div class="question-block">
                    <div class="question-title">${item.q}</div>
                    <select id="setup-q-${index}">${optionsHTML}</select>
                </div>`;
        });
    }

    function generateLink() {
        let answers = [];
        quizData.forEach((_, index) => {
            answers.push(document.getElementById(`setup-q-${index}`).value);
        });

        const dataObj = { name: ownerName, ans: answers };
        const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(dataObj))));
        
        const fullUrl = window.location.origin + window.location.pathname + '?q=' + encodedData;

        document.getElementById('step-setup').classList.add('hidden');
        document.getElementById('step-link').classList.remove('hidden');
        document.getElementById('final-link').innerText = fullUrl;
    }

    function copyLink() {
        navigator.clipboard.writeText(document.getElementById('final-link').innerText);
        alert("تم نسخ الرابط! ابعته لصحابك دلوقتي 🚀");
    }

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const rawData = params.get('q');

        if(rawData) {
            document.getElementById('step-intro').classList.add('hidden');
            document.getElementById('step-friend-intro').classList.remove('hidden');

            try {
                const decodedData = JSON.parse(decodeURIComponent(escape(atob(rawData))));
                ownerName = decodedData.name;
                ownerAnswers = decodedData.ans;
                
                document.getElementById('friend-welcome').innerText = `اختبار عن ${ownerName} 🕵️‍♂️`;
            } catch(e) {
                alert("الرابط ده بايظ أو ناقص!");
            }
        }
    };

    function startFriendQuiz() {
        const friendName = document.getElementById('friend-name').value.trim();
        if(!friendName) return alert("اكتب اسمك عشان " + ownerName + " يعرف مين جاوب!");

        document.getElementById('step-friend-intro').classList.add('hidden');
        document.getElementById('step-friend-quiz').classList.remove('hidden');
        document.getElementById('quiz-header').innerText = `بتعرف ${ownerName} قد إيه؟`;

        const container = document.getElementById('friend-questions-container');
        quizData.forEach((item, index) => {
            let optionsHTML = item.options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
            container.innerHTML += `
                <div class="question-block">
                    <div class="question-title">${item.q}</div>
                    <select id="friend-q-${index}">
                        <option value="" disabled selected>اختار الإجابة...</option>
                        ${optionsHTML}
                    </select>
                </div>`;
        });
    }

    function submitQuiz() {
        const friendName = document.getElementById('friend-name').value.trim();
        let score = 0;
        let isComplete = true;

        quizData.forEach((_, index) => {
            const val = document.getElementById(`friend-q-${index}`).value;
            if(!val) isComplete = false;
            if(val === ownerAnswers[index]) score++;
        });

        if(!isComplete) return alert("جاوب على كل الـ 20 سؤال متسيبش حاجة فاضية!");

        document.getElementById('step-friend-quiz').classList.add('hidden');
        document.getElementById('step-result').classList.remove('hidden');

        let percent = Math.round((score / quizData.length) * 100);
        animateCircle(percent);
        showAnalysis(percent, friendName);
        sendToTelegram(friendName, score, percent);
    }

    function animateCircle(targetPercent) {
        let current = 0;
        const circle = document.getElementById('result-circle');
        const text = document.getElementById('result-percent');
        const interval = setInterval(() => {
            if(current >= targetPercent) {
                clearInterval(interval);
                text.innerText = targetPercent + "%";
            } else {
                current++;
                text.innerText = current + "%";
                circle.style.background = `conic-gradient(var(--primary) ${current * 3.6}deg, #eee 0deg)`;
            }
        }, 20);
    }

    function showAnalysis(percent, friendName) {
        const titleEl = document.getElementById('result-title');
        const textEl = document.getElementById('analysis-text');

        if(percent >= 90) {
            titleEl.innerText = "توأم روحه! 💖🔥";
            textEl.innerHTML = `<b>تحليل نتيجتك يا ${friendName}:</b><br>إنت جاوبت على أسئلة عميقة جداً ومغلطتش غير في حاجات بسيطة! إنت حافظ ${ownerName} أكتر من نفسه! عارف تفاصيله الصغيره، روتينه، جنانه، وحركاته. العلاقة دي مش مجرد صداقة، دي عشرة عمر وفاهمين بعض من نظرة عين. عاش جداً!`;
        } else if(percent >= 60) {
            titleEl.innerText = "صاحب جدع وأصيل! 💛✨";
            textEl.innerHTML = `<b>تحليل نتيجتك يا ${friendName}:</b><br>إنت تعرف ${ownerName} كويس جداً، بس في شوية تفاصيل دقيقة سقطت منك. بشكل عام إنتوا قريبين من بعض وفاهمين دماغ بعض في المواقف الكبيرة. محتاج تركز معاه شوية كمان عشان تقفل اللعبة!`;
        } else if(percent >= 30) {
            titleEl.innerText = "معرفة سطحية ⚠️";
            textEl.innerHTML = `<b>تحليل نتيجتك يا ${friendName}:</b><br>يا دوبك تعرف قشور عن ${ownerName}. أسئلة الشخصية العميقة وقعتك! علاقتكم محتاجة تتطور أكتر وتقعدوا مع بعض تتكلموا في تفاصيل أكتر. إنتوا حالياً في خانة "الزمايل" مش الصحاب الانتيم!`;
        } else {
            titleEl.innerText = "إنت جيت هنا صدفة؟! 💔🥶";
            textEl.innerHTML = `<b>تحليل نتيجتك يا ${friendName}:</b><br>إنت متعرفش أي حاجة عن ${ownerName} حرفياً! إنت بتجاوب بالبركة أو لسه متعرفين على بعض إمبارح. روح اتعرف عليه الأول وافهم دماغه بدل الفضايح دي!`;
        }
    }

    function sendToTelegram(friendName, score, percent) {
        const msg = `🔔 *نتيجة اختبار صداقة جديدة!*\n━━━━━━━━━━━━\n👤 *صاحب الاختبار:* ${ownerName}\n👥 *اللي جاوب:* ${friendName}\n📊 *النتيجة:* ${score} من ${quizData.length} (${percent}%)\n━━━━━━━━━━━━`;
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`)
        .catch(err => console.error("Error sending to telegram"));
    }
</script>

</body>
</html>
